@if(usuario){
<ion-app>
  <ion-router-outlet></ion-router-outlet>
</ion-app>
}
@else{
<ion-card>
  <ion-card-header>
    <ion-card-title>App de cine</ion-card-title>
    <ion-card-subtitle>Reserva tus asientos</ion-card-subtitle>
  </ion-card-header>

  @if(crearCuenta){
    <ion-card-content>
    <ion-list>
      <ion-list>
        <ion-item>
          <ion-input label="Nombre" [(ngModel)]="usuarioNuevo.nombres" placeholder="Nombre"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Email" [(ngModel)]="usuarioNuevo.email" type="email" placeholder="email@domain.com"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Password" [(ngModel)]="usuarioNuevo.password" type="password"></ion-input>
        </ion-item>
        <ion-button color="success" (click)="crearUsuario()">
          Crear
          <ion-icon name="person-add-outline"></ion-icon>
        </ion-button>
        <ion-button color="danger" (click)="cancelar()">Cancelar</ion-button>
      </ion-list>
    </ion-list>
  </ion-card-content>
  }
  @else{
  <ion-card-content>
    <ion-list>
      <ion-list>
        <ion-item>
          <ion-input label="Email" [(ngModel)]="usuarioLogin.correo" type="correo" placeholder="email@domain.com"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Password" [(ngModel)]="usuarioLogin.password" type="password"></ion-input>
        </ion-item>
        <ion-button (click)="login()">
          <ion-icon name="accessibility-outline"></ion-icon>
          Ingresar
        </ion-button>
        <ion-button color="warning" (click)="crearCuentaBtn()">
          Crear cuenta
          <ion-icon name="person-add-outline"></ion-icon>
        </ion-button>
        
      </ion-list>
    </ion-list>
  </ion-card-content>
}
</ion-card>
}
