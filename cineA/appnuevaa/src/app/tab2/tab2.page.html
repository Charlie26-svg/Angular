<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Lista de anuncios 
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de anuncios</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item>

      <ion-label><b>Id</b> </ion-label>
      <ion-label>Titulo</ion-label>
      <ion-label>Descripcion</ion-label>
      <ion-label>Fecha Publicacion</ion-label>
      <ion-label>Hashtag</ion-label>
      <ion-label>Imagen</ion-label>

  
    </ion-item>
    @for(anuncio of anuncios; track anuncio.idanuncio){
    <ion-item>

      <ion-label>{{anuncio.idanuncio}}</ion-label>
      <ion-label>{{anuncio.titulo}}</ion-label>
      <ion-label>{{anuncio.descripcion}}</ion-label>
      <ion-label>{{anuncio.fechaPublicacion}}</ion-label>
      <ion-label>{{anuncio.hashtag}}</ion-label>

      
<ion-label>
  @if(anuncio.imagen){
    <img
      [src]="anuncio.imagen"
      width="100"
      alt="Imagen del anuncio">
  }
</ion-label>

    </ion-item>
    }

  </ion-list>

</ion-content>
