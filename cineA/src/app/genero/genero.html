<h2>Crear género:</h2>

<form [formGroup]="formulario" (ngSubmit)="guardarGenero()">

    <label>Nombre:</label>
    <input type="text" formControlName="nombre">

    @if (formulario.get('nombre')?.invalid &&
         formulario.get('nombre')?.touched){
        <div> El nombre es Obligatorio</div>
    }
    
    <br><br>

    <button type="submit">Guardar</button>

</form>

<h2>Consulta de géneros:</h2>

<table>
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
        </tr>
    </thead>
    

    <tbody>
        @for(genero of generos; track genero.idgenero){
            <tr>
                <td>{{genero.idgenero}}</td>
                <td>{{genero.nombre}}</td>
            </tr>
        }
    </tbody>
</table>
